name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  # Windows only: the backends are Win32 FFI and the GUI is a Windows app. Tests touch no driver.
  build-and-test:
    name: Build, test and package (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Test, lint, build and smoke-test with Rust
        run: cargo xtask build

      - name: Smoke-test native AMD diagnostic commands
        run: |
          cargo xtask amd probe --mock || exit /b 1
          cargo xtask amd exports --mock || exit /b 1
          cargo xtask amd features --mock || exit /b 1
          cargo xtask amd write-check --mock || exit /b 1
          cargo xtask amd telemetry --mock || exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: roch-gpu-dist
          path: dist/
          retention-days: 14
