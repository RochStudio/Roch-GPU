[workspace]
resolver = "3"
members = ["crates/roch-core", "crates/roch-nvidia", "crates/roch-amd", "crates/roch-intel", "crates/roch-gpu", "xtask"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Roch Studio"]
repository = "https://github.com/RochStudio/Roch-GPU"

[workspace.dependencies]
roch-core = { path = "crates/roch-core" }
roch-nvidia = { path = "crates/roch-nvidia" }
roch-amd = { path = "crates/roch-amd" }
roch-intel = { path = "crates/roch-intel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.10"
libloading = "0.8"
winreg = "0.55"
windows-sys = { version = "0.59" }

# Size-tuned (measured in crates/roch-gpu/PERF.md): "s" + fat LTO is 23% smaller than 3 + thin
# and costs ~2 ms of startup; the app's hot paths wait on the driver and on vsync, not the CPU.
# "z" came out larger than "s". panic stays "unwind": the poll loop and backend detection
# catch_unwind so a panicking driver call cannot stop a running fan curve or the vendor fallback.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
